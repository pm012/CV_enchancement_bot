<svg id="mainDiagramSvg" width="940" height="740" viewBox="0 0 940 740" xmlns="http://www.w3.org/2000/svg" class="select-none max-w-full h-auto">
                <defs>
                    <!-- Arrow Marker Endings -->
                    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
                    </marker>
                    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
                    </marker>
                    <marker id="arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e"/>
                    </marker>
                </defs>

                <!-- Background Panel -->
                <rect width="940" height="740" rx="16" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

                <!-- Header Banner -->
                <text x="470" y="32" fill="#58a6ff" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">RESUME ENHANCER APP — STATE &amp; WORKFLOW DIAGRAM</text>
                <line x1="40" y1="48" x2="900" y2="48" stroke="#21262d" stroke-width="1"/>

                <!-- CONNECTING LINES (Static Paths with Clear Head Markers) -->

                <!-- Start -> Upload -->
                <path d="M 470,100 L 470,138" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

                <!-- Upload -> Data Store -->
                <path d="M 470,195 L 470,233" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

                <!-- Data Store -> Main Menu -->
                <path d="M 470,290 L 470,338" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow-indigo)"/>

                <!-- Main Menu -> Mode 1 -->
                <path d="M 370,365 C 150,365 140,405 140,443" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow-indigo)"/>
                <!-- Mode 1 -> Main Menu Return -->
                <path d="M 165,443 C 165,390 350,380 370,380" stroke="#484f58" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)"/>

                <!-- Main Menu -> Mode 2 -->
                <path d="M 420,395 L 360,443" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow-indigo)"/>
                <!-- Mode 2 -> Main Menu Return -->
                <path d="M 380,443 L 440,395" stroke="#484f58" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)"/>

                <!-- Main Menu -> Mode 3 -->
                <path d="M 520,395 L 580,443" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow-indigo)"/>
                <!-- Mode 3 -> Main Menu Return -->
                <path d="M 560,443 L 500,395" stroke="#484f58" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)"/>

                <!-- Main Menu -> Mode 4 -->
                <path d="M 570,365 C 790,365 800,405 800,443" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow-indigo)"/>
                <!-- Mode 4 -> Main Menu Return -->
                <path d="M 775,443 C 775,390 590,380 570,380" stroke="#484f58" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)"/>

                <!-- Modes -> Reset State Connections (Global Action) -->
                <path d="M 140,525 L 140,600 C 140,625 380,625 400,625" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-rose)"/>
                <path d="M 360,525 L 360,590 L 420,590" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-rose)"/>
                <path d="M 580,525 L 580,590 L 520,590" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-rose)"/>
                <path d="M 800,525 L 800,600 C 800,625 560,625 540,625" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-rose)"/>

                <!-- Main Menu direct connection to Reset -->
                <path d="M 470,395 L 470,578" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-rose)"/>

                <!-- Reset Loop back to Start -->
                <path d="M 470,650 L 470,700 C 470,720 50,720 50,380 C 50,75 390,75 413,75" stroke="#f43f5e" stroke-width="2" fill="none" marker-end="url(#arrow-rose)"/>



                <!-- 1. START NODE -->
                <g>
                    <rect x="415" y="60" width="110" height="40" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
                    <circle cx="433" cy="80" r="6" fill="#38bdf8"/>
                    <text x="447" y="84" fill="#f0f6fc" font-family="Inter, sans-serif" font-size="12" font-weight="600">Start / Restart</text>
                </g>

                <!-- 2. UPLOAD DATA NODE -->
                <g>
                    <rect x="330" y="140" width="280" height="55" rx="10" fill="#161b22" stroke="#38bdf8" stroke-width="2"/>
                    <text x="470" y="163" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Upload Resume &amp; Job Description</text>
                    <text x="470" y="181" fill="#7d8590" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">(Formats: PDF, DOCX, Plain Text)</text>
                </g>

                <!-- 3. SAVE / DATA PROCESSING STORAGE -->
                <g>
                    <path d="M 370 235 C 370 227, 570 227, 570 235 L 570 280 C 570 288, 370 288, 370 280 Z" fill="#161b22" stroke="#30363d" stroke-width="2"/>
                    <path d="M 370 235 C 370 243, 570 243, 570 235" fill="none" stroke="#30363d" stroke-width="2"/>
                    <text x="470" y="262" fill="#58a6ff" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Save &amp; Normalize CV Data</text>
                </g>

                <!-- 4. MAIN MENU NODE -->
                <g>
                    <rect x="370" y="340" width="200" height="55" rx="28" fill="#1e1b4b" stroke="#6366f1" stroke-width="2.5"/>
                    <text x="470" y="372" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Main Menu / Mode Select</text>
                </g>

                <!-- 5. FOUR WORK MODES -->

                <!-- Mode 1: General CV Review -->
                <g>
                    <rect x="50" y="445" width="180" height="80" rx="12" fill="#161b22" stroke="#6366f1" stroke-width="2"/>
                    <rect x="62" y="458" width="22" height="22" rx="6" fill="#312e81"/>
                    <text x="73" y="473" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1</text>
                    <text x="92" y="473" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="700">General CV Review</text>
                    <text x="62" y="502" fill="#7d8590" font-family="Inter, sans-serif" font-size="10">Grammar, style &amp; impact notes</text>
                </g>

                <!-- Mode 2: Cover Letter Generator -->
                <g>
                    <rect x="270" y="445" width="180" height="80" rx="12" fill="#161b22" stroke="#6366f1" stroke-width="2"/>
                    <rect x="282" y="458" width="22" height="22" rx="6" fill="#312e81"/>
                    <text x="293" y="473" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2</text>
                    <text x="312" y="473" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="700">Cover Letter Gen</text>
                    <text x="282" y="502" fill="#7d8590" font-family="Inter, sans-serif" font-size="10">Tailored cover letter creation</text>
                </g>

                <!-- Mode 3: LinkedIn Summary -->
                <g>
                    <rect x="490" y="445" width="180" height="80" rx="12" fill="#161b22" stroke="#6366f1" stroke-width="2"/>
                    <rect x="502" y="458" width="22" height="22" rx="6" fill="#312e81"/>
                    <text x="513" y="473" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3</text>
                    <text x="532" y="473" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="700">LinkedIn Summary</text>
                    <text x="502" y="502" fill="#7d8590" font-family="Inter, sans-serif" font-size="10">Bio &amp; headline optimization</text>
                </g>

                <!-- Mode 4: Match Analysis -->
                <g>
                    <rect x="710" y="445" width="180" height="80" rx="12" fill="#161b22" stroke="#6366f1" stroke-width="2"/>
                    <rect x="722" y="458" width="22" height="22" rx="6" fill="#312e81"/>
                    <text x="733" y="473" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4</text>
                    <text x="752" y="473" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="700">Match Analysis</text>
                    <text x="722" y="502" fill="#7d8590" font-family="Inter, sans-serif" font-size="10">Score % &amp; missing skills</text>
                </g>

                <!-- 6. RESET BUTTON NODE -->
                <g>
                    <rect x="400" y="580" width="140" height="70" rx="35" fill="#881337" stroke="#f43f5e" stroke-width="2"/>
                    <text x="470" y="612" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Restart / Reset</text>
                    <text x="470" y="628" fill="#fecdd3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Upload New Data</text>
                </g>

                <!-- Annotations / Legend -->
                <g>
                    <!-- Mode Switch Legend -->
                    <rect x="250" y="310" width="120" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
                    <text x="310" y="324" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Switch Mode</text>

                    <!-- Reset Legend -->
                    <rect x="80" y="650" width="160" height="22" rx="4" fill="#161b22" stroke="#f43f5e" stroke-width="1"/>
                    <text x="160" y="665" fill="#f43f5e" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Reset Data (From Any Mode)</text>
                </g>
            </svg>